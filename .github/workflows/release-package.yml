name: Release-Paketpruefung

on:
  pull_request:
    paths:
      - '.github/workflows/release-package.yml'
      - 'tools/New-ReleasePackage.ps1'
      - 'tools/verify_release_package.py'
      - 'tools/installer/**'
      - 'tests/test_release_package.py'
      - 'src/**'
      - 'third_party/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-package.yml'
      - 'tools/New-ReleasePackage.ps1'
      - 'tools/verify_release_package.py'
      - 'tools/installer/**'
      - 'tests/test_release_package.py'
      - 'src/**'
      - 'third_party/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline-Tests fuer gueltige und manipulierte ZIPs
        run: python -B -m unittest tests.test_release_package

      - name: Release-Solution ohne Spiel bauen
        shell: pwsh
        run: |
          $Vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $MSBuild = & $Vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $MSBuild) { throw 'MSBuild nicht installiert' }
          & $MSBuild DeadlyDaysCoop.sln /m /nologo /v:m "/p:Configuration=Release;Platform=x64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Eigenes Testpaket erzeugen
        shell: pwsh
        run: |
          & ./tools/New-ReleasePackage.ps1 -Version ci-check -Bin (Join-Path $env:GITHUB_WORKSPACE 'bin\Release') -OutputDir $env:RUNNER_TEMP
          if (-not (Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'DDCoop-ci-check.zip'))) {
            throw 'Release-Paket fehlt'
          }

      - name: Echte DLLs, Inhalt und SHA256 verifizieren
        run: python -B tools/verify_release_package.py "${{ runner.temp }}\DDCoop-ci-check.zip"
