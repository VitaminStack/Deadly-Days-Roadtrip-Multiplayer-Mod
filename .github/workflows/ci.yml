name: CI

# Reine Doku-Änderungen bauen nicht. TODO.md, README und Fortschrittsbild prüft der Workflow „Doku“ bei jeder Änderung.
# Der Workflow läuft trotzdem immer: Die Branch-Regel für main verlangt die Prüfungen build-and-test (Debug/Release). Mit
# paths-ignore fehlten sie bei Doku-PRs ganz, und der Merge blieb gesperrt. Darum entscheidet der Job changes, und die
# Build-Schritte überspringen sich; der Job selbst meldet dann Erfolg.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ein neuer Push auf denselben PR bricht den überholten Lauf ab. Auf main läuft jeder Commit zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Liefert code=false nur, wenn sicher nur *.md oder docs/ geändert wurden. Im Zweifel code=true, dann wird gebaut.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geänderte Dateien
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -u
          # Beim PR ist HEAD der Merge-Commit mit main, der Vergleich mit dessen erstem Elternteil zeigt nur die Änderungen
          # des PR. Auf main der Stand vor dem Push; beim ersten Push (lauter Nullen) schlägt der Vergleich fehl, dann bauen.
          if [ "$EVENT" = "pull_request" ]; then Base="HEAD^1"; else Base="$PUSH_BEFORE"; fi
          if ! Files=$(git diff --name-only "$Base" HEAD 2>/dev/null) || [ -z "$Files" ]; then
            echo "Vergleich mit $Base nicht möglich oder leer, es wird gebaut."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$Files"
          if echo "$Files" | grep -qvE '(\.md$|^docs/)'; then Code=true; else Code=false; fi
          echo "code=$Code"
          echo "code=$Code" >> "$GITHUB_OUTPUT"

  # Ausfallsicher: Scheitert changes, ist code leer und es wird gebaut. Übersprungen wird nur bei code=false.
  build-and-test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # Release baut vorerst nicht: Die Branch-Regel verlangt die Prüfung build-and-test (Release), also bleibt der Job
      # bestehen und meldet Erfolg. Wieder bauen, wenn die Aufgabe `release` ansteht: bei allen Schritten und beim Schritt
      # „Release-ZIP“ (dort steht `&& false`) die Einschränkung auf Debug und das `false` wieder entfernen.
      - name: Release übersetzt vorerst nicht
        if: matrix.configuration == 'Release'
        run: echo "Release-Build pausiert bis zur Aufgabe release, Debug prüft Build und Tests."

      - name: Nur Doku geändert
        if: needs.changes.outputs.code == 'false'
        run: echo "Nur *.md oder docs/ geändert, Build und Tests übersprungen."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'

      # ccache sitzt als cl.exe vor dem echten Compiler. Dafür ruft MSBuild den Compiler je Datei auf (MultiToolTask),
      # und src/Common.props stellt mit DdcoopCompilerCache auf /Z7 und eine Objektdatei je Quelle um.
      - name: Compiler-Cache laden
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        continue-on-error: true # Cache-Service-Ausfall darf den Compiler nicht blockieren.
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.configuration }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.configuration }}-

      - name: Compiler-Cache einrichten
        id: compiler_cache
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        continue-on-error: true # Download, SHA-Pruefung und Setup sind optional, Build nicht.
        shell: pwsh
        run: |
          $Version = '4.10.2'
          $Zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest "https://github.com/ccache/ccache/releases/download/v$Version/ccache-$Version-windows-x86_64.zip" -OutFile $Zip
          $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash
          if ($Hash -ne '6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9') { throw "ccache.zip unerwartet: $Hash" }
          Expand-Archive $Zip -DestinationPath $env:RUNNER_TEMP
          $Bin = Join-Path $env:RUNNER_TEMP 'ccache-bin'
          New-Item -ItemType Directory -Force $Bin | Out-Null
          # Als cl.exe ruft MSBuild es auf, unter eigenem Namen nimmt es Befehle wie --show-stats an.
          $Exe = Join-Path $env:RUNNER_TEMP "ccache-$Version-windows-x86_64\ccache.exe"
          Copy-Item $Exe (Join-Path $Bin 'cl.exe')
          Copy-Item $Exe (Join-Path $Bin 'ccache.exe')
          $Vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $Vs = & $Vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $ToolsVersion = (Get-Content (Join-Path $Vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          $Cl = Join-Path $Vs "VC\Tools\MSVC\$ToolsVersion\bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $Cl)) { throw "cl.exe fehlt: $Cl" }
          "CCACHE_BIN=$Bin" >> $env:GITHUB_ENV
          "CCACHE_COMPILER=$Cl" >> $env:GITHUB_ENV
          # Die Runner wechseln zwischen Images mit demselben Compiler, aber anderer Dateizeit von cl.exe. Die
          # Standardprüfung über die Dateizeit verwirft dann den ganzen Cache, die Toolset-Version nicht.
          "CCACHE_COMPILERCHECK=string:$ToolsVersion" >> $env:GITHUB_ENV
          $env:CCACHE_COMPILER = $Cl
          & (Join-Path $Bin 'ccache.exe') --zero-stats
          if ($LASTEXITCODE -ne 0) { throw 'ccache --zero-stats ist fehlgeschlagen' }

      - name: Solution bauen
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        shell: pwsh
        run: |
          $Vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $MSBuild = & $Vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $UseCache = '${{ steps.compiler_cache.outcome }}' -eq 'success'
          if (-not $UseCache) { Write-Warning 'ccache nicht verfuegbar: direkter MSVC-Build ohne Compiler-Cache.' }
          $BuildArguments = @(& ./tools/Ci-CompilerArgs.ps1 -Configuration '${{ matrix.configuration }}' -CacheBin $env:CCACHE_BIN -CacheReady:$UseCache)
          & $MSBuild DeadlyDaysCoop.sln @BuildArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compiler-Cache Statistik
        if: always() && needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug' && steps.compiler_cache.outcome == 'success'
        shell: pwsh
        run: '& "$env:CCACHE_BIN\ccache.exe" --show-stats'

      - name: C++-Tests
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        run: .\bin\${{ matrix.configuration }}\CoreTests.exe

      - name: UI-Tests (ohne Spiel und SDK)
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        run: .\bin\${{ matrix.configuration }}\UITests.exe

      - name: Game-Tests (ohne Spiel und SDK)
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        run: .\bin\${{ matrix.configuration }}\GameTests.exe

      - name: Net-Tests (ohne Spiel und Steam)
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Debug'
        run: .\bin\${{ matrix.configuration }}\NetTests.exe

      # Nutzt die ohnehin gebauten echten DLLs. Keine zusaetzliche Windows-Build-Matrix.
      - name: Release-ZIP packen und offline pruefen
        if: needs.changes.outputs.code != 'false' && matrix.configuration == 'Release' && false
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'DDCoop-ci-check.zip'
          & ./tools/New-ReleasePackage.ps1 -Version ci-check -Bin (Join-Path $env:GITHUB_WORKSPACE 'bin\Release') -OutputDir $env:RUNNER_TEMP
          if (-not (Test-Path -LiteralPath $Archive)) { throw 'Release-ZIP fehlt' }
          & python -B tools/verify_release_package.py $Archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Hängt nicht von Debug/Release ab, darum einmal und parallel zum Build.
  scripts:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python-Tests
        run: python -B -m unittest discover -s tests

      - name: Compiler-Cache-Fallback pruefen (ohne Spiel)
        shell: pwsh
        run: ./tests/Test-CiCompilerArgs.ps1

      - name: Spike-Autoritaet und Readiness (ohne Spiel und SDK)
        shell: pwsh
        run: ./tests/Run-BlockadeAuthority.ps1

      - name: Remote-P2-Map und Geraete-Guard (ohne Spiel und SDK)
        shell: pwsh
        run: ./tests/Run-RemoteP2.ps1
