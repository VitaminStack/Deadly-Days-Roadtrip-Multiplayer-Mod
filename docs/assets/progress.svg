      <text x="125" y="418"></text>
      <text x="490" y="418">129 of 135</text>
      <rect x="630" y="403" width="200" height="18" rx="4" fill="#e5e7eb"/>
      <rect x="630" y="403" width="191" height="18" rx="4" fill="#64748b"/>
      <text x="846" y="418">95 %</text>
